[project]
name = "deepscout"
version = "0.5.2"
description = "Production-grade multi-agent deep research with LangGraph and DeepAgents."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
authors = [{ name = "Epsilon-Alpha-Beta" }]
dependencies = [
  "deepagents==0.7.13",
  "langgraph>=1.0,<2.0",
  "langchain>=1.4,<2.0",
  "langchain-anthropic>=1.7,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "tavily-python>=0.5",
  "langchain-mcp-adapters==0.3.2",
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.35,<1",
  "prometheus-client>=0.21,<1",
  "redis>=7,<9",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]==3.3.5",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9", "langgraph-cli[inmem]>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
